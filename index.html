<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Names of colors in spanish</title>
    <link rel="stylesheet" href="./spanish.css"
</head>
<body>
    <h1>Colors</h1>
    <h2>Learn the colors in spanish</h2>
    <h2 class="color-title" id="red">Rojo</h2>
    <img class="color" src="red.png" alt="red">
    <h2 class="color-title" id="blue">Azul</h2>
    <img class="color" src="blue.png" alt="blue">
    <h2 class="color-title" id="orange">Anaranjado</h2>
    <img class="color" src="orange.png" alt="orange">
    <h2 class="color-title" id="green">Verde</h2>
    <img class="color" src="green.png" alt="green">
    <h2 class="color-title" id="yellow">Amarillo</h2>
    <img class="color" src="yellow.png" alt="yellow">
</body>
</html>
